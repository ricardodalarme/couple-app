version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - ":package: dependencies"
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    commit-message:
