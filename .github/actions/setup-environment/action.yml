name: Setup Environment
description: Setup environment for the project

runs:
  using: "composite"
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Install melos
      uses: bluefireteam/melos-action@v3
      with:
        run-bootstrap: false

    - name: Generate env
      shell: bash
      run: cp .env.example .env.development
