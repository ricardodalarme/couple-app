name: monorepo
publish_to: "none"

environment:
  sdk: ">=3.6.0 <4.0.0"

workspace:
  - app
  - storybook
  - app/packages/common_ui
  - app/packages/core
  - app/packages/formz_inputs
  - app/packages/network
  - app/packages/services/analytics
  - app/packages/services/biometric
  - app/packages/services/crash_report
  - app/packages/services/persistent_storage
  - app/packages/services/remote_config
  - app/packages/services/secure_storage

dev_dependencies:
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4
  husky: ^0.1.7
  melos: ^6.2.0
