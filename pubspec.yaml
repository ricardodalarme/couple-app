name: monorepo
publish_to: "none"

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

workspace:
  - app
  - packages/common_ui
  - packages/core
  - packages/design_system
  - packages/design_system/tool
  - packages/form_inputs
  - packages/formatters
  - packages/logger
  - packages/network
  - packages/services/**

dev_dependencies:
  dependabot_gen:
    git:
      url: https://github.com/renancaraujo/dependabot_gen
      ref: 12d7c8569e6b43b1439bc0162bb9b5c38f0fed19
  husky: ^0.1.7
  melos: ^8.10.1

melos:
  ide:
    intellij:
      enabled: false

  command:
    bootstrap:
      hooks:
        pre: melos hooks && cp .env.example .env.development

  scripts:
    # Flutter commands
    get:
      run: flutter pub get
      description: Get all dependencies.

    upgrade:
      run: flutter pub upgrade --major-versions
      description: Upgrade all dependencies.

    lint:
      steps:
        - analyze
        - format:no-output
      description: Lint all packages.

    analyze:
      run: flutter analyze --no-pub
      description: Analyze all packages.

    format:
      run: git ls-files '*.dart' -z | xargs -0 dart format
      description: Run `dart format` for all packages.

    format:no-output:
      run: git ls-files '*.dart' -z | xargs -0 dart format --output none --set-exit-if-changed
      description: Run `dart format` for all packages and fail if any files need to be formatted.

    test:
      exec: |
        if ! find test -name '*_test.dart' -print -quit | grep -q .; then
          echo "No test files; skipping."
          exit 0
        fi
        if grep -q "sdk: flutter" pubspec.yaml; then
          flutter test --no-pub
        else
          dart test
        fi
      description: Run tests in every workspace package only.
      packageFilters:
        dirExists: test

    # App commands
    l10n:
      exec: dart run slang
      description: Generate localization files.
      packageFilters:
        dependsOn: slang

    l10n:analyze:
      exec: dart run slang analyze --exit-if-changed
      description: Analyze localization files.
      packageFilters:
        dependsOn: slang

    gen:
      run: dart run build_runner build --workspace
      description: Run build_runner in all packages.

    graphql:schema:
      run: |
        set -e
        token="${SCHEMA_AUTH_TOKEN:-}"
        if [ -z "${SERVER_URL:-}" ] || [ -z "${SERVER_API_KEY:-}" ]; then
          . ./.env.development
        fi
        token="${token:-${SCHEMA_AUTH_TOKEN:-}}"
        if [ -z "$token" ]; then
          ref=$(printf '%s' "$SUPABASE_URL" | sed -E 's#https://([^.]+)\.supabase\.co.*#\1#')
          token=$(supabase projects api-keys --project-ref "$ref" 2>/dev/null | python3 -c 'import sys,json; s=sys.stdin.read(); i=s.find("{"); d=json.loads(s[i:]); print(next(k["api_key"] for k in d["keys"] if k.get("id") == "service_role"))')
        fi
        if [ -z "$token" ]; then
          echo "No service_role token: set SCHEMA_AUTH_TOKEN or log in with the Supabase CLI." >&2
          exit 1
        fi
        get-graphql-schema "$SERVER_URL" --header "apikey=$SERVER_API_KEY" \
          --header "Authorization=Bearer $token" \
          > app/lib/features/_shared/data/data_sources/schema.graphql
      description: Regenerate the complete GraphQL schema with a service_role token.

    splash_screen:
      exec: flutter pub run flutter_native_splash:create
      description: Update the app splash screen.
      packageFilters:
        dependsOn:
          - flutter_native_splash

    launcher_icon:
      exec: dart run icons_launcher:create
      description: Update the app launcher icon.
      packageFilters:
        dependsOn:
          - icons_launcher

    build:android-dev:
      exec: flutter build appbundle --flavor development --dart-define-from-file ../.env.development
      description: (DEV) Build the Android app.
      packageFilters:
        scope:
          - flutter_bloc_starter

    build:android-prd:
      exec: flutter build appbundle --flavor production --dart-define-from-file ../.env.production
      description: (PRD) Build the Android app.
      packageFilters:
        scope:
          - flutter_bloc_starter

    # Git commands
    hooks:
      run: dart run husky install
      description: Install git hooks.

    # Misc
    dependabot:
      run: |
        dart run dependabot_gen:depgen create \
          --ecosystems githubActions,pub \
          --ignore-paths 'app/ios/.symlinks/**' \
          --labels ':package: dependencies' \
          --commit-message-prefix 'chore' \
          --commit-message-include 'scope'
