name: monorepo
publish_to: "none"

environment:
  sdk: ^3.13.7
  flutter: 3.47.9

workspace:
  - app
  - packages/common_ui
  - packages/core
  - packages/form_inputs
  - packages/formatters
  - packages/logger
  - packages/network
  - packages/services/analytics
  - packages/services/authentication
  - packages/services/biometric
  - packages/services/crash_report
  - packages/services/device_info
  - packages/services/preferences
  - packages/services/remote_config
  - packages/services/secure_storage

dev_dependencies:
  dependabot_gen:
    git:
      url: https://github.com/renancaraujo/dependabot_gen
      ref: 12d7c8569e6b43b1439bc0162bb9b5c38f0fed19
  husky: ^0.1.7
  melos: ^7.8.0
  very_good_cli: ^1.2.0

melos:
  ide:
    intellij:
      enabled: false

  command:
    bootstrap:
      hooks:
        pre: melos hooks && cp .env.example .env.development

  scripts:
    # Flutter commands
    get:
      run: flutter pub get
      description: Get all dependencies.

    upgrade:
      run: flutter pub upgrade --major-versions
      description: Upgrade all dependencies.

    lint:
      steps:
        - analyze
        - format:no-output
      description: Lint all packages.

    analyze:
      run: flutter analyze --no-pub
      description: Analyze all packages.

    format:
      run: git ls-files '*.dart' -z | xargs -0 dart format
      description: Run `dart format` for all packages.

    format:no-output:
      run: git ls-files '*.dart' -z | xargs -0 dart format --output none --set-exit-if-changed
      description: Run `dart format` for all packages and fail if any files need to be formatted.

    test:
      run: dart run very_good_cli:very_good test -r -- --no-pub
      description: Run all tests available.

    # App commands
    l10n:
      exec: dart run slang
      description: Generate localization files.
      packageFilters:
        dependsOn: slang

    l10n:analyze:
      exec: dart run slang analyze --exit-if-changed
      description: Analyze localization files.
      packageFilters:
        dependsOn: slang

    gen:
      run: dart run build_runner build --workspace
      description: Run build_runner in all packages.

    splash_screen:
      exec: flutter pub run flutter_native_splash:create
      description: Update the app splash screen.
      packageFilters:
        dependsOn:
          - flutter_native_splash

    launcher_icon:
      exec: dart run icons_launcher:create
      description: Update the app launcher icon.
      packageFilters:
        dependsOn:
          - icons_launcher

    build:android-dev:
      exec: flutter build appbundle --flavor development --dart-define-from-file ../.env.development
      description: (DEV) Build the Android app.
      packageFilters:
        scope:
          - flutter_bloc_starter

    build:android-prd:
      exec: flutter build appbundle --flavor production --dart-define-from-file ../.env.production
      description: (PRD) Build the Android app.
      packageFilters:
        scope:
          - flutter_bloc_starter

    # Git commands
    hooks:
      run: dart run husky install
      description: Install git hooks.

    # Misc
    dependabot:
      run: |
        dart run dependabot_gen:depgen create \
          --ecosystems githubActions,pub \
          --ignore-paths 'app/ios/.symlinks/**' \
          --labels ':package: dependencies' \
          --commit-message-prefix 'chore' \
          --commit-message-include 'scope'
