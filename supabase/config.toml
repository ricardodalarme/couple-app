# Repara backend. Remote project ref: esbhdlbhbeoiwaonsgdg (sa-east-1). Link with:
#   supabase link --project-ref esbhdlbhbeoiwaonsgdg
project_id = "repara"

[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 56323

[local_smtp]
enabled = true
port = 56324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "repara://auth-callback"
additional_redirect_urls = ["repara://auth-callback", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

# Production sign-in is Apple and Google only (product decision of 8 Nov): no email/password, no magic link.
# Email sign-up stays on here only so the dev menu's debug sign-in works on the local stack and simulators.
# Never run `supabase config push` with this file against production: it would open sign-up to throwaway accounts.
[auth.email]
enable_signup = true
enable_confirmations = false

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
skip_nonce_check = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[analytics]
enabled = true
port = 56327
backend = "postgres"

[experimental.pgdelta]
enabled = true

# Guest pages and webhooks authenticate by token or shared secret, not by a user JWT.
[functions.guest]
verify_jwt = false

[functions.push-sender]
verify_jwt = false

[functions.purchases-webhook]
verify_jwt = false

[functions.places]
verify_jwt = true

[functions.chat]
verify_jwt = true

[functions.storage-cleanup]
verify_jwt = false
