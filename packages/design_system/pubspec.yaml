name: design_system
resolution: workspace
publish_to: "none"

environment:
  sdk: ^3.14.0
  flutter: ^3.50.0

dependencies:
  cached_network_image_ce: ^4.13.2
  clock: ^1.1.3
  flutter:
    sdk: flutter
  flutter_svg: ^2.4.0
  material_ui: ^1.11.0
  skeletonizer: ^3.0.0
  slang: ^4.19.2
  slang_flutter: ^4.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf
    - family: AppIcons
      fonts:
        - asset: assets/fonts/app_icons.ttf
