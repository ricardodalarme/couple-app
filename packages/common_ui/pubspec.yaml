name: common_ui
resolution: workspace
publish_to: "none"

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.4
  gap: ^3.0.1

dev_dependencies:
  build_runner: ^2.12.2
  flutter_gen_runner: ^5.13.0+1
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/
    - assets/logos/

flutter_gen:
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true
  line_length: 100
  output: lib/src/generated/

  integrations:
    flutter_svg: true
