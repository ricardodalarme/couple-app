name: common_ui
resolution: workspace
publish_to: "none"

environment:
  sdk: ^3.13.7
  flutter: ^3.47.9

dependencies:
  cached_network_image: ^4.0.6
  cupertino_ui: ^1.1.6
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2
  gap: ^3.0.1
  material_ui: ^1.10.0
  skeletonizer: ^3.0.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_gen_runner: ^5.15.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/
    - assets/logos/

flutter_gen:
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true
  line_length: 100
  output: lib/src/generated/

  integrations:
    flutter_svg: true
