name: common_ui
resolution: workspace
publish_to: "none"

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  gap: ^3.0.1
  skeletonizer: ^2.1.3

dev_dependencies:
  build_runner: ^2.15.0
  flutter_gen_runner: ^5.14.1
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/
    - assets/logos/

flutter_gen:
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true
  line_length: 100
  output: lib/src/generated/

  integrations:
    flutter_svg: true
