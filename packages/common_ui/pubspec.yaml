name: common_ui
resolution: workspace
publish_to: "none"

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  gap: ^3.0.1

dev_dependencies:
  build_runner: ^2.7.1
  flutter_gen_runner: ^5.12.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/
    - assets/logos/

flutter_gen:
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true
  line_length: 100
  output: lib/src/generated/

  integrations:
    flutter_svg: true
