mutation InsertHistoryMemory(
  $id: UUID!
  $coupleId: UUID
  $title: String!
  $body: String
  $happenedOn: Date!
  $datePrecision: DatePrecision!
  $place: String
  $origin: MemoryOrigin!
) {
  insertIntoMemoriesCollection(
    objects: [
      {
        id: $id
        coupleId: $coupleId
        title: $title
        body: $body
        happenedOn: $happenedOn
        datePrecision: $datePrecision
        place: $place
        origin: $origin
      }
    ]
  ) {
    affectedCount
  }
}
