mutation InsertStoryEvent(
  $id: UUID!
  $coupleId: UUID
  $kind: StoryEventKind!
  $title: String
  $happenedOn: Date!
  $datePrecision: DatePrecision!
) {
  insertIntoStoryEventsCollection(
    objects: [
      {
        id: $id
        coupleId: $coupleId
        kind: $kind
        title: $title
        happenedOn: $happenedOn
        datePrecision: $datePrecision
      }
    ]
  ) {
    affectedCount
  }
}
