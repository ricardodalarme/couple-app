mutation UpdateStoryEvent(
  $id: UUID!
  $coupleId: UUID
  $kind: StoryEventKind!
  $title: String
  $happenedOn: Date!
  $datePrecision: DatePrecision!
) {
  updateStoryEventsCollection(
    set: {
      coupleId: $coupleId
      kind: $kind
      title: $title
      happenedOn: $happenedOn
      datePrecision: $datePrecision
    }
    filter: { id: { eq: $id } }
    atMost: 1
  ) {
    affectedCount
  }
}
