mutation UpdateHistoryMemory(
  $id: UUID!
  $coupleId: UUID
  $title: String!
  $body: String
  $happenedOn: Date!
  $datePrecision: DatePrecision!
  $place: String
  $origin: MemoryOrigin!
) {
  updateMemoriesCollection(
    set: {
      coupleId: $coupleId
      title: $title
      body: $body
      happenedOn: $happenedOn
      datePrecision: $datePrecision
      place: $place
      origin: $origin
    }
    filter: { id: { eq: $id } }
    atMost: 1
  ) {
    affectedCount
  }
}
