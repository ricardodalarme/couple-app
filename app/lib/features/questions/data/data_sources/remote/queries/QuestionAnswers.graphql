query QuestionAnswers($questionSlug: String!) {
  partnerAnswered(questionSlug: $questionSlug)
  questionAnswersCollection(filter: { questionSlug: { eq: $questionSlug } }, first: 10) {
    edges {
      node {
        id
        isMine
        coupleId
        questionSlug
        body
      }
    }
  }
}
