mutation UpdateMood($id: UUID!, $mood: Mood!, $need: MoodNeed, $share: MoodShare!, $day: Date!) {
  updateMoodsCollection(
    set: { mood: $mood, need: $need, share: $share }
    filter: { id: { eq: $id }, day: { eq: $day } }
  ) {
    affectedCount
    records {
      id
      day
      mood
      need
      share
    }
  }
}
