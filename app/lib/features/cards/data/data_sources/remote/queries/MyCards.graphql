query MyCards($first: Int, $after: Cursor) {
  cardsCollection(
    first: $first
    after: $after
    filter: { status: { eq: sent } }
    orderBy: [{ sentAt: DescNullsLast }]
  ) {
    edges {
      node {
        id
        isMine
        sentAt
        weekStart
        items {
          edges {
            node {
              slipId
            }
          }
        }
        reaction {
          reaction
          reply
        }
        open {
          openedAt
        }
      }
    }
    pageInfo {
      ...PageInfoFragment
    }
  }
}
