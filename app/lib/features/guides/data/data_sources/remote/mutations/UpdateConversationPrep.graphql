mutation UpdateConversationPrep(
  $id: UUID!
  $guide: ConversationGuide!
  $topic: String!
  $notes: String
  $draft: String
) {
  updateConversationPrepsCollection(
    set: { guide: $guide, topic: $topic, notes: $notes, draft: $draft }
    filter: { id: { eq: $id } }
    atMost: 1
  ) {
    affectedCount
  }
}
