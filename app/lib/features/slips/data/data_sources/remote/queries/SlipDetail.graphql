query SlipDetail($id: UUID!) {
  slipsByPk(id: $id) {
    id
    body
    kind
    feeling
    planNote
    forCard
    category
    workArea
    createdAt
    archivedAt
    deletedAt
    inJar
    cardItemsCollection(first: 1) {
      edges {
        node {
          id
        }
      }
    }
  }
}
