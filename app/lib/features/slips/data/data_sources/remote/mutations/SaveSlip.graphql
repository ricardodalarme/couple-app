mutation SaveSlip(
  $id: UUID!
  $body: String!
  $kind: String
  $feeling: String
  $planNote: String
  $forCard: Boolean
  $createdAt: Datetime
) {
  saveSlip(
    id: $id
    body: $body
    kind: $kind
    feeling: $feeling
    planNote: $planNote
    forCard: $forCard
    createdAt: $createdAt
  ) {
    id
  }
}
