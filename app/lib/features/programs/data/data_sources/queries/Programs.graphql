query Programs($locale: String!) {
  programs: contentItemsCollection(
    filter: { kind: { eq: "program" }, locale: { eq: $locale }, published: { eq: true } }
    orderBy: [{ position: AscNullsLast }]
    first: 100
  ) {
    edges {
      node {
        slug
        title
        body
        position
        plusOnly
        sensitive
      }
    }
  }
  lessons: contentItemsCollection(
    filter: { kind: { eq: "lesson" }, locale: { eq: $locale }, published: { eq: true } }
    orderBy: [{ position: AscNullsLast }]
    first: 500
  ) {
    edges {
      node {
        slug
        title
        body
        parentSlug
        position
        plusOnly
        sensitive
      }
    }
  }
}
