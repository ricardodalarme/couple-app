query SentPartnerMessages($senderId: UUID!) {
  partnerMessagesCollection(
    filter: { senderId: { eq: $senderId } }
    orderBy: [{ createdAt: DescNullsLast }]
    first: 30
  ) {
    edges {
      node {
        id
        kind
        body
        mediaPath
        forWidget
        createdAt
      }
    }
  }
}
