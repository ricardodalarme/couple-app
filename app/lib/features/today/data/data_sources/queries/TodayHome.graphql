query TodayHome {
  today {
    isPaired
    partnerName
    cardStatus
    unopenedCards
    slipsThisWeek
    slipsTotal
    hasPendingInvite
    togetherSince
    pauseIsMine
    pauseReturnAt
    hasPlus
    unseenSignals
  }
  question: dailyContent(kind: "question") {
    slug
    title
    tags
  }
  idea: dailyContent(kind: "daily_idea") {
    slug
    title
    body
  }
}
