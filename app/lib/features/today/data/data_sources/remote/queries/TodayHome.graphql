query TodayHome {
  today {
    isPaired
    partnerName
    localDate
    cardStatus
    unopenedCards
    slipsThisWeek
    slipsTotal
    hasPendingInvite
    togetherSince
    pauseIsMine
    pauseReturnAt
    hasPlus
    unseenSignals
    slipDays
  }
  question: dailyContent(kind: "question") {
    slug
    title
    tags
  }
  idea: dailyContent(kind: "daily_idea") {
    slug
    title
    body
  }
  partnerMoodToday {
    id
    day
    mood
    need
  }
  myMood: moodsCollection(first: 1, orderBy: [{day: DescNullsLast}]) {
    edges {
      node {
        day
        mood
      }
    }
  }
}
