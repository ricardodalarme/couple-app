mutation UpsertCouplePhoto($coupleId: UUID!, $storagePath: String!, $uploadedBy: UUID!) {
  updateCouplePhotosCollection(
    set: { storagePath: $storagePath, uploadedBy: $uploadedBy }
    filter: { coupleId: { eq: $coupleId } }
    atMost: 1
  ) {
    affectedCount
  }
}

mutation InsertCouplePhoto($coupleId: UUID!, $storagePath: String!, $uploadedBy: UUID!) {
  insertIntoCouplePhotosCollection(
    objects: [{ coupleId: $coupleId, storagePath: $storagePath, uploadedBy: $uploadedBy }]
  ) {
    affectedCount
  }
}
