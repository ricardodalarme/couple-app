"""The root type for creating and mutating data"""
type Mutation {
  """
  Pairs the caller with whoever created the invite. Returns null when the code
  is invalid, expired, cancelled or either side is already paired.
  """
  acceptInvite(code: String!): Couples

  """
  Adds or removes the caller's own agreement to an agreement. Nobody can agree for the other.
  """
  agree(agreementId: UUID!, agreed: Boolean = true): Agreements

  """Saves the caller's answer to one item of an active game."""
  answerGame(sessionId: UUID!, idx: Int!, answer: String!): Boolean

  """Archives a slip, or restores it when archived is false."""
  archiveSlip(id: UUID!, archived: Boolean = true): Slips

  """Cancels a pending account deletion."""
  cancelAccountDeletion: Boolean

  """Cancels an unused invite the caller created."""
  cancelInvite(inviteId: UUID!): Boolean

  """
  Creates a link that lets someone without an account read one card. The token is returned once and never stored.
  """
  createGuestLink(cardId: UUID!): GuestLinkCreated

  """Creates an invite. The plain code is returned once and never stored."""
  createInvite: InviteCreated

  """Sends a message to support. Returns true when it was received."""
  createSupportRequest(topic: String!, message: String!, replyEmail: String, appVersion: String): Boolean

  """Removes a card the caller wrote, for both sides."""
  deleteCard(cardId: UUID!): Boolean

  """Deletes zero or more records from the `Agreements` collection"""
  deleteFromAgreementsCollection(
    """Restricts the mutation's impact to records matching the criteria"""
    filter: AgreementsFilter

    """
    The maximum number of records in the collection permitted to be affected
    """
    atMost: Int! = 1
  ): AgreementsDeleteResponse!

  """Deletes zero or more records from the `AppConfig` collection"""
  deleteFromAppConfigCollection(
    """Restricts the mutation's impact to records matching the criteria"""
    filter: AppConfigFilter

    """
    The maximum number of records in the collection permitted to be affected
    """
    atMost: Int! = 1
