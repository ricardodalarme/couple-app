mutation UpdateLearnedItem($id: UUID!, $text: String!) {
  updateLearnedItemsCollection(set: { text: $text }, filter: { id: { eq: $id } }) {
    affectedCount
  }
}

mutation SetLearnedItemStatus($id: UUID!, $status: String!) {
  updateLearnedItemsCollection(set: { status: $status }, filter: { id: { eq: $id } }) {
    affectedCount
  }
}
