mutation AddGiftWish($id: UUID!, $title: String!, $note: String, $budget: GiftBudget, $coupleId: UUID) {
  insertIntoGiftIdeasCollection(
    objects: [
      { id: $id, title: $title, note: $note, budget: $budget, coupleId: $coupleId, kind: wish }
    ]
  ) {
    records {
      ...GiftWishFragment
    }
  }
}
