mutation AddMemory(
  $id: UUID!
  $title: String!
  $body: String
  $happenedOn: Date!
  $place: String
  $coupleId: UUID
) {
  insertIntoMemoriesCollection(
    objects: [
      {
        id: $id
        title: $title
        body: $body
        happenedOn: $happenedOn
        place: $place
        coupleId: $coupleId
      }
    ]
  ) {
    affectedCount
  }
}
