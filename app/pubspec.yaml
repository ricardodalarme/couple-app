name: quickstart_flutter_bloc
resolution: workspace
publish_to: "none"
version: 0.1.1+3

environment:
  sdk: ^3.10.0

dependencies:
  analytics_service:
    path: ../packages/services/analytics
  auto_route: ^10.2.3
  biometric_service:
    path: ../packages/services/biometric
  cached_network_image: ^3.4.1
  common_ui:
    path: ../packages/common_ui
  core:
    path: ../packages/core
  crash_report_service:
    path: ../packages/services/crash_report
  equatable: ^2.0.7
  firebase_core: ^4.2.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  form_inputs:
    path: ../packages/form_inputs
  formatters:
    path: ../packages/formatters
  network:
    path: ../packages/network
  persistent_storage_service:
    path: ../packages/services/persistent_storage
  remote_config_service:
    path: ../packages/services/remote_config
  secure_storage_service:
    path: ../packages/services/secure_storage
  slang: ^4.11.0
  slang_flutter: ^4.11.0
  webview_flutter: ^4.13.0
  widgetbook: ^3.20.1

dev_dependencies:
  auto_route_generator: ^10.2.6
  bloc_test: ^10.0.0
  build_runner: ^2.10.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  graphql_codegen: ^3.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: true
