targets:
  $default:
    builders:
      auto_route_generator:auto_route_generator:
        generate_for:
          - lib/features/**/presentation/**.dart
      graphql_codegen:
        options:
          assetsPath: lib/features/**/data_sources/**.graphql
          clients:
            - graphql
          disableCopyWithGeneration: true
          generatedFileHeader: "// dart format width=100\n"
          namingSeparator: ""
          outputDirectory: generated
          scalars:
            DateTime:
              type: DateTime
            JSONObject:
              type: Map<String, dynamic>
