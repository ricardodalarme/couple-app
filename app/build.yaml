targets:
  $default:
    builders:
      auto_route_generator:auto_route_generator:
        generate_for:
          - lib/features/**/presentation/**.dart
          - lib/features/dev_menu/debug_sign_in/*_page.dart
      graphql_codegen:
        options:
          assetsPath: lib/features/**/data_sources/**.graphql
          clients:
            - graphql
          disableCopyWithGeneration: true
          generatedFileHeader: "// dart format width=100\n"
          namingSeparator: ""
          outputDirectory: generated
          scalars:
            BigFloat:
              type: double
              fromJsonFunctionName: double.parse
              toJsonFunctionName: ((v) => "$v")
            BigInt:
              type: BigInt
              fromJsonFunctionName: BigInt.parse
              toJsonFunctionName: ((v) => "$v")
            Date:
              type: DateTime
              toJsonFunctionName: ((v) => v.toIso8601String().substring(0, 10))
            Datetime:
              type: DateTime
            JSON:
              type: dynamic
              fromJsonFunctionName: jsonDecode
              toJsonFunctionName: jsonEncode
              import: dart:convert
            Opaque:
              type: Object
            Time:
              type: String
            UUID:
              type: String
