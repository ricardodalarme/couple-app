name: common_ui
resolution: workspace
publish_to: "none"

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.1.0
  gap: ^3.0.1
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_gen_runner: ^5.10.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/
    - assets/logos/

flutter_gen:
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true
  line_length: 100
  output: lib/src/generated/

  integrations:
    flutter_svg: true
